<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Travel Journey</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================== -->
    <!-- Navigation -->
    <!-- ==================== -->

    <header class="navbar">

        <div class="logo">
            ✈️ My Travel
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#trips">Trips</a>
            <a href="#about">About</a>
        </nav>

    </header>


    <!-- ==================== -->
    <!-- Hero -->
    <!-- ==================== -->

    <section id="home" class="hero">

        <div class="hero-content">

            <p class="hero-subtitle">
                MY TRAVEL JOURNEY
            </p>

            <h1>
                Explore the World
            </h1>

            <p>
                記錄每一次旅行，
                收藏每一段美好的回憶。
            </p>

            <a href="#trips" class="hero-button">
                Explore Trips
            </a>

        </div>

    </section>


    <!-- ==================== -->
    <!-- Trips -->
    <!-- ==================== -->

    <section id="trips" class="trips">

        <div class="section-title">

            <p>MY JOURNEYS</p>

            <h2>
                Explore My Trips
            </h2>

        </div>


        <div class="trip-grid">


            <!-- Okinawa -->

            <a href="okinawa/" class="trip-card">

                <div class="trip-image okinawa-image">

                    <img
                        src="images/okinawa/cover.jpg"
                        alt="Okinawa"
                    >

                </div>

                <div class="trip-info">

                    <span class="country">
                        🇯🇵 JAPAN
                    </span>

                    <h3>
                        Okinawa
                    </h3>

                    <p>
                        沖繩
                    </p>

                    <span class="year">
                        2026
                    </span>

                </div>

            </a>


            <!-- Busan -->

            <a href="busan/" class="trip-card">

                <div class="trip-image">

                    <img
                        src="images/busan/cover.jpg"
                        alt="Busan"
                    >

                </div>

                <div class="trip-info">

                    <span class="country">
                        🇰🇷 KOREA
                    </span>

                    <h3>
                        Busan
                    </h3>

                    <p>
                        釜山
                    </p>

                    <span class="year">
                        2026
                    </span>

                </div>

            </a>


            <!-- Seoul -->

            <a href="seoul/" class="trip-card">

                <div class="trip-image">

                    <img
                        src="images/seoul/cover.jpg"
                        alt="Seoul"
                    >

                </div>

                <div class="trip-info">

                    <span class="country">
                        🇰🇷 KOREA
                    </span>

                    <h3>
                        Seoul
                    </h3>

                    <p>
                        首爾
                    </p>

                    <span class="year">
                        Coming Soon
                    </span>

                </div>

            </a>


        </div>

    </section>


    <!-- ==================== -->
    <!-- About -->
    <!-- ==================== -->

    <section id="about" class="about">

        <p>ABOUT</p>

        <h2>
            My Travel Story
        </h2>

        <p>
            每一次旅行，
            都是一段值得記錄的故事。
        </p>

    </section>


    <!-- ==================== -->
    <!-- Footer -->
    <!-- ==================== -->

    <footer>

        <p>
            © 2026 My Travel Journey
        </p>

    </footer>


    <script src="js/main.js"></script>

</body>
</html>
